# Единая конфигурация стенда "семантическое членство кода".
# Пути относительно experiments/semantic_membership/.
seed: 20261003
paths:
  raw_repos: data/raw            # клоны репозиториев
  functions: data/functions      # {split}.jsonl
  queries: data/queries          # {set}.jsonl
  indexes: data/indexes
  results: results
  figures: ../../paper/figures
languages: [python, c, cpp, go, java, javascript]
extract:
  min_lines: 3
  max_lines: 300
  max_tokens: 2048
  skip_dirs: [vendor, third_party, thirdparty, external, deps, node_modules, test, tests, testdata, examples, benchmarks, build, dist, contrib, submodules]
dedup:
  k: 25                          # k-грамма для near-dup фильтра между сплитами
  w: 25
  overlap_threshold: 0.3         # доля общих отпечатков, выше которой функция считается дубликатом
splits:                          # доли репозиториев public-корпуса
  public_train: 0.6
  public_calib: 0.2
  public_test: 0.2
windows:                         # файловые окна protected (сценарий IDE, kind: window)
  size: 20
  stride: 10
transforms:
  max_per_split: 5000            # функций на набор запросов (стратификация по языку и бину длины)
  programmatic: [identity, reformat, strip_comments, rename_ids, change_literals, insert_deadcode, reorder_stmts, combo]
  partial_lines: [3, 5, 10, 20, 40]
  deadcode_every: 3              # вставка no-op каждые N строк (атака в стиле Mossad)
  llm: [paraphrase, translate]   # только на GPU-машине, см. transforms/llm_paraphrase.py
  llm_model: Qwen/Qwen2.5-Coder-7B-Instruct
  llm_sample_per_split: 5000
fingerprint:
  k: 25
  w: 25
  hmac_key_env: SMCODE_INDEX_KEY  # ключ HMAC для отпечатков (не хранить в репозитории)
  minhash_perm: 128
  minhash_shingle: 5
  minhash_lsh_threshold: 0.3     # порог LSH для кандидатов M2
  exact_window: 5                # M0: окна по 5 строк, keyed blake2b-64
  common_df: 50                  # фильтр общности M1: df по функциям public_train
  common_file_frac: 0.05         # ... или доля файлов protected
  common_min_files: 3            # ... и не менее стольких файлов protected
semantic:
  base_model: microsoft/unixcoder-base
  max_length: 512
  pooling: mean
  temperature: 0.05
  batch_size: 128
  epochs: 2
  lr: 2.0e-5
  warmup_frac: 0.05
  weight_decay: 0.01
  own_lr: 3.0e-4                 # скорость обучения own_small_model
  hard_negatives_per_anchor: 2
  ann_top_k: 20
  hybrid_rule: logistic          # logistic | two_threshold (абляция)
  hybrid_thresholds: {cos: 0.8, overlap: 0.2}   # правило двух порогов, формула (9) статьи
  combiner_C: 1.0
  combiner_n_index: 20000        # обучение комбинатора на public_train (половина репозиториев)
  combiner_n_anchors: 2000
  combiner_n_neg: 2000           # функции второй половины репозиториев (вне индекса)
  own_small_model:               # вариант "своя модель с нуля" (лицензионно чистый)
    enabled: false
    layers: 6
    hidden: 384
    heads: 6
    vocab: 32000
calibration:
  alphas: [0.01, 0.001]
  method: split_conformal        # порог = ⌈(n+1)(1-alpha)⌉-я порядковая статистика скоров негативов; решение score > τ
  domain_calib_fraction: 0.5     # доля репозиториев hard_neg в доменной калибровке (остальные — тест)
privacy:
  projection: keyed_orthogonal
  quant_bits: [8, 4, 1]
  noise_sigma: [0.0, 0.05, 0.1, 0.2]
  attack_leaked_pairs: [0, 100, 1000, 10000]
  bow_vocab: 20000
eval:
  bootstrap: 1000
  latency_repeats: 200
  length_bins_tokens: [[0, 32], [32, 64], [64, 128], [128, 256], [256, 100000]]
