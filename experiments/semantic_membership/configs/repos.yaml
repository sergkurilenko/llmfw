# Списки репозиториев для стенда «семантическое членство кода» (DESIGN.md §2.1).
#
# protected_pool — кандидаты домена security/network/crypto. Из них детерминированно
#   (seed из default.yaml, smcode.data.list_repos.split_repos) выбираются n_protected
#   репозиториев в роль `protected`, остальные становятся `hard_neg`; выбор стратифицирован по
#   языку (квоты пропорциональны пулу, каждый язык присутствует в обеих ролях), поэтому в пуле
#   должно быть >= 2 репозитория на каждый язык из default.yaml: languages.
#   Распределение сохраняется в data/functions/repo_splits.json вместе с sha1 этого файла;
#   после правки списков его нужно пересчитать (`--force`) и повторить клонирование.
# public — репозитории других предметных областей; делятся по репозиториям на
#   public_train / public_calib / public_test (доли из default.yaml: splits), со
#   стратификацией по языку.
# domain_keywords — ключевые слова домена protected/hard_neg; репозитории, у которых
#   имя/описание/темы содержат такое слово, исключаются из public (используется при
#   расширении списка через api.github.com и как проверка ручного списка).
#
# Формат записи: {repo: owner/name, lang: <python|c|cpp|go|java|javascript>}.
# Переименованные на GitHub репозитории клонируются через редирект.
# Лицензии и доступность проверяются при клонировании (scripts/00_clone.sh); репозитории
# размером > 300 МБ пропускаются.

