# >= 4 символов ищутся и как подстроки, напр. "crypto" -> "cryptography", "cryptopp"; короткие
# ключи (ssl, ssh, vpn, ids) — только как отдельные слова, поэтому составные формы перечислены
# явно: openvpn, libssh, sshd, ssh2, ...). Фильтр по пути файла внутри public-репозиториев —
# smcode.data.extract.domain_path_match.
